<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let player, cursors, bullets;

        function preload() {
            // Replace these URLs with your GitHub asset paths
            this.load.image('ship', 'assets/player.png');
            this.load.image('bullet', 'assets/bullet.png');
        }

        function create() {
            player = this.physics.add.sprite(400, 500, 'ship');
            player.setCollideWorldBounds(true);
            
            bullets = this.physics.add.group({
                defaultKey: 'bullet',
                maxSize: 10

                this.physics.world.on('worldbounds', (body) => { body.gameObject.setActive(false).setVisible(false); });
            });

            cursors = this.input.keyboard.createCursorKeys();
            this.input.keyboard.on('keydown-SPACE', shoot, this);

enemies = this.physics.add.group();

let enemy = enemies.create(400, 100, 'enemySprite');

this.physics.add.overlap(bullets, enemies, hitEnemy, null, this);
        }

        function update() {
            if (cursors.left.isDown) player.setVelocityX(-300);
            else if (cursors.right.isDown) player.setVelocityX(300);
            else player.setVelocityX(0);

    player.setVelocity(0);

                
    if (cursors.left.isDown) {
        player.setVelocityX(-300);
    } else if (cursors.right.isDown) {
        player.setVelocityX(300);
    }

   
    if (cursors.up.isDown) {
        player.setVelocityY(-300);
    } else if (cursors.down.isDown) {
        player.setVelocityY(300);
    }
    
    bullets.children.each(function(bullet) {
        if (bullet.active && bullet.y < -50) { 
            bullet.setActive(false).setVisible(false);
            bullet.body.stop();
        }
    }, this);
}
}
        }

        function shoot() {
            let bullet = bullets.get(player.x, player.y - 20);
            if (bullet) {
                bullet.setActive(true).setVisible(true);
                bullet.body.velocity.y = -500;

                bullet.setCollideWorldBounds(true);
                bullet.body.onWorldBounds = true;
            }
        }
    </script>
</body>
</html>
